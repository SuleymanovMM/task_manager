global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "identity-service"
    static_configs:
      - targets: ["identity-service:8000"]
    metrics_path: "/metrics"

  - job_name: "project-service"
    static_configs:
      - targets: ["project-service:8001"]
    metrics_path: "/metrics"

  - job_name: "task-service"
    static_configs:
      - targets:
          - "task-service-1:8002"
          - "task-service-2:8002"
    metrics_path: "/metrics"

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8003"]
    metrics_path: "/metrics"