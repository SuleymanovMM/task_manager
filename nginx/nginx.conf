user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'req_id="$req_id"';

    access_log /var/log/nginx/access.log main;

    # Используем X-Request-ID клиента, иначе — встроенный $request_id nginx.
    # Имя $req_id, а не $request_id, чтобы не затенять встроенную переменную.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Зоны rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    # Апстримы
    upstream identity_service {
        server identity-service:8000;
    }

    upstream project_service {
        server project-service:8001;
    }

    upstream task_service {
        server task-service-1:8002;
        server task-service-2:8002;
    }

    upstream notification_service {
        server notification-service:8003;
    }

    server {
        listen 80;
        server_name localhost;

        # Заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Без слэша на конце: у location — иначе nginx 301-редиректит голый
        # POST /api/v1/projects на добавление слэша (это ломает POST-клиентов);
        # у proxy_pass — иначе nginx обрежет префикс вместо полного пути,
        # а бэкенды ждут путь целиком. Префиксный матчинг при этом не теряется.

        # Swagger UI каждого сервиса под одним origin (порт 80), чтобы
        # persistAuthorization в браузере переживал переход между сервисами.
        location /identity/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://identity_service;
        }

        location /project/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://project_service;
        }

        location /task/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://task_service;
        }

        location /notification/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://notification_service;
        }

        # Identity: жёсткая зона auth — только для login/register (единственные
        # неавторизованные ручки, реальная цель брутфорса/спама). Остальное под
        # /api/v1/auth уже требует JWT или непредсказуемый refresh-токен и имеет
        # свой точный лимит на Redis в самом identity-service.
        location /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://identity_service;
        }

        location /api/v1/auth/register {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://identity_service;
        }

        location /api/v1/auth {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://identity_service;
        }

        # Project
        location /api/v1/projects {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://project_service;
        }

        location /api/v1/teams {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://project_service;
        }

        location /api/v1/invitations {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://project_service;
        }

        # Task
        location /api/v1/tasks {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://task_service;
        }

        # Notification
        location /api/v1/notifications {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://notification_service;
        }

        # Health-check, без rate limiting
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}